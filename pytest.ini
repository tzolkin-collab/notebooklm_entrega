[pytest]
# `server/` nao e um pacote — os modulos se importam entre si por nome
# (main.py faz `from mcp_server import ...`). Colocar server/ no sys.path
# reproduz o layout que o container usa (WORKDIR /app com os arquivos na raiz).
pythonpath = server
testpaths = server/tests

# As tools do MCP e as funcoes de rpc.py sao async. Sem isto, pytest coleta os
# testes async e os ignora com warning — passa verde sem ter rodado nada.
asyncio_mode = auto

addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
